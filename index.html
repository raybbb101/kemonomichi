<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>けものみち</title>
  <meta name="description" content="動物たちが力を合わせて進む、HD-2D 協力型ローグライク">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <!-- タイトル -->
  <section id="title" class="screen">
    <div class="title-box">
      <div class="logo-sub">HD-2D 協力ローグライク</div>
      <h1 class="logo">けものみち</h1>
      <div class="logo-en">KEMONO MICHI</div>
      <label class="field">なまえ<input id="name" maxlength="10" placeholder="なまえを入力"></label>
      <div class="menu">
        <button id="btn-solo" class="btn primary">ひとりで冒険</button>
        <button id="btn-host" class="btn">ルームを作る</button>
        <div class="join-row">
          <input id="join-code" maxlength="5" placeholder="ルームコード" autocomplete="off">
          <button id="btn-join" class="btn">参加</button>
        </div>
        <button id="btn-codex" class="btn ghost">融合種 図鑑（全28種）</button>
      </div>
      <div id="title-msg" class="msg"></div>
    </div>
    <div class="controls-hint">移動 WASD / 矢印　通常攻撃 J　スキル K　特殊 L　必殺 I　回避 Space　調べる E</div>
  </section>

  <!-- ロビー・キャラクター選択 -->
  <section id="lobby" class="screen hidden">
    <div class="lobby-wrap">
      <div class="lobby-side panel">
        <div class="room-label">ルームコード</div>
        <div id="room-code" class="room-code">-----</div>
        <button id="btn-copy" class="btn small ghost">コードをコピー</button>
        <div class="room-label">なかま</div>
        <ul id="lobby-players"></ul>
        <button id="btn-start" class="btn primary">冒険に出発</button>
        <div id="lobby-msg" class="msg"></div>
      </div>
      <div class="lobby-main panel">
        <h2>どの動物になる？</h2>
        <div id="animal-grid" class="animal-grid"></div>
        <div id="animal-detail" class="animal-detail"></div>
      </div>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="stage-info"><div id="stage-num"></div><div id="stage-biome"></div></div>
    <div id="gold"></div>
    <div id="party"></div>
    <div id="bossbar" class="hidden"><div class="boss-name"></div><div class="bar"><i></i></div></div>
    <div id="me-panel">
      <canvas id="me-portrait" width="24" height="24"></canvas>
      <div class="me-info">
        <div class="me-name"></div>
        <div class="bar hp"><i></i><b></b><span></span></div>
        <div class="bar xp"><i></i></div>
      </div>
    </div>
    <div id="skills"></div>
    <div id="items-bar"></div>
    <div id="prompt" class="hidden"></div>
    <div id="riddle" class="panel hidden"></div>
    <div id="levelup" class="hidden"></div>
  </div>

  <div id="toasts"></div>
  <div id="modal" class="hidden"><div class="modal-box panel"></div></div>
  <button id="btn-mute" title="音の切り替え (M)">♪</button>

  <script type="module" src="src/main.js"></script>
</body>
</html>
